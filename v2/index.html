/* Військова топографія — styles
   Layout: one reading column (max 680px). Course map → module page (staircase of steps) → test.
   Palette taken from a paper map: map-blue accent, contour brown, forest green. Maps always sit on light "paper". */
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2190-2199, U+2212, U+2215, U+FEFF, U+FFFD }
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116 }
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2199, U+2212 }
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0400-045F, U+0490-0491, U+2116 }
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2199, U+2212 }
@font-face { font-family: "Plex Sans"; src: url(fonts/ibm-plex-sans-cyrillic-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+0400-045F, U+0490-0491, U+2116 }
@font-face { font-family: "Plex Mono"; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2199, U+2212 }
@font-face { font-family: "Plex Mono"; src: url(fonts/ibm-plex-mono-cyrillic-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; unicode-range: U+0400-045F, U+0490-0491 }

:root {
  --bg: #f3f1ea; --surface: #ffffff; --sunk: #e9e6dc; --ink: #1d221d; --muted: #5a6058; --line: #dcd8cc;
  --accent: #2b5f7e; --on-accent: #ffffff; --accent-soft: #dfeaf1; --copper: #9a5520; --copper-soft: #f4e6d6;
  --ok: #2d6e45; --ok-bg: #e1f0e5; --bad: #a63a32; --bad-bg: #f7e2df; --warn: #8e6110; --warn-bg: #f6ebd3;
  --board: #3b5a2a; --board-ink: #eef3ea;
  --fig-bg: #fbfaf6; --paper: #f8f5ea; --paper-ink: #222;
  --sans: "Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11140f; --surface: #191d17; --sunk: #141812; --ink: #e7eae4; --muted: #9ea69b; --line: #2d332a;
  --accent: #7fb6d6; --on-accent: #0f1418; --accent-soft: #1a2c37; --copper: #e3a36b; --copper-soft: #36271a;
  --ok: #78d39d; --ok-bg: #18321f; --bad: #f19288; --bad-bg: #3a1f1c; --warn: #e6bb63; --warn-bg: #352b15;
  --board: #3d5a2c; --board-ink: #eef3ea; --fig-bg: #1c211a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11140f; --surface: #191d17; --sunk: #141812; --ink: #e7eae4; --muted: #9ea69b; --line: #2d332a;
  --accent: #7fb6d6; --on-accent: #0f1418; --accent-soft: #1a2c37; --copper: #e3a36b; --copper-soft: #36271a;
  --ok: #78d39d; --ok-bg: #18321f; --bad: #f19288; --bad-bg: #3a1f1c; --warn: #e6bb63; --warn-bg: #352b15;
  --board: #3d5a2c; --board-ink: #eef3ea; --fig-bg: #1c211a;
  color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.55 var(--sans) }
button { font: inherit; color: inherit }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; border-radius: 6px }
[hidden] { display: none !important }
img { max-width: 100%; display: block }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)) }
.top-in { max-width: 680px; margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 8px }
.top h1 { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none }
.icon-btn:active { background: var(--sunk) }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.lang { font: 600 13px/1 var(--mono); border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 9px; cursor: pointer; flex: none }

/* banner */
.banner { background: var(--copper-soft); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)) }
.banner-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px }
.banner p { margin: 0; font-size: 14.5px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }

/* page */
main { max-width: 680px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
.eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--copper) }
h2.page { font-size: clamp(24px, 6vw, 30px); line-height: 1.18; margin: 6px 0 8px; text-wrap: balance }
.lede { color: var(--muted); margin: 0 0 6px; max-width: 62ch }
.muted { color: var(--muted) }
.small { font-size: 13.5px }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--on-accent); text-decoration: none }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent) }
.btn.quiet { background: var(--sunk); color: var(--ink) }
.btn.wide { width: 100% }
.btn:disabled { opacity: .45; cursor: default }

/* course map */
.part { margin-top: 26px }
.part h3 { font-size: 13px; font-family: var(--mono); font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px }
.mods { display: flex; flex-direction: column; gap: 8px }
.mod { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer }
.mod .n { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 600 17px/1 var(--mono); background: var(--sunk); color: var(--muted) }
.mod.open .n { background: var(--accent-soft); color: var(--accent) }
.mod.passed .n { background: var(--accent); color: var(--on-accent) }
.mod .tt { min-width: 0 }
.mod .tt b { display: block; font-size: 15.5px; line-height: 1.3 }
.mod .tt span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px }
.mod.locked { cursor: default }
.mod.locked .tt b { color: var(--muted) }
.chip { font: 500 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; white-space: nowrap }
.chip.ok { background: var(--ok-bg); color: var(--ok) }
.chip.new { background: var(--copper-soft); color: var(--copper) }
.chip.lock { background: var(--sunk); color: var(--muted) }
.progressbar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin: 14px 0 4px }
.progressbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.footer-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px }

/* staircase legend */
.stairs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 16px 0 6px }
.stairs span { min-width: 0; overflow-wrap: anywhere; font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 3px solid var(--line); padding-top: 6px }
.stairs span.on { color: var(--accent); border-color: var(--accent) }

/* steps */
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 14px; overflow: hidden }
.step-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0 }
.kind { font: 500 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap }
.kind.k3 { background: var(--copper-soft); color: var(--copper) }
.kind.k5 { background: var(--board); color: var(--board-ink) }
.step h3 { font-size: 19px; line-height: 1.3; margin: 10px 16px 6px; text-wrap: balance }
.step .body { padding: 0 16px 14px }
.step .body p { margin: 0 0 10px; max-width: 64ch }
.step .body ul { margin: 0 0 10px; padding-left: 20px }
.step .body li { margin-bottom: 4px }
.step .body b { font-weight: 600 }
.key { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; font-weight: 600 }
.formula { font: 500 17px/1.4 var(--mono); background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; text-align: center; overflow-x: auto }

/* figures */
.fig { background: var(--fig-bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 12px }
.fig svg { display: block; width: 100%; height: auto }
.fig .cap { font-size: 13px; color: var(--muted); padding: 8px 16px 10px }
.fig .cap a { color: var(--muted) }
.photo { position: relative; background: #fff }
.photo img { width: 100%; height: auto }
.pair { display: grid; grid-template-columns: 1fr; }
@media (min-width: 620px) { .pair { grid-template-columns: 1fr 1fr } }
.pair > div { position: relative; min-width: 0 }
.pair .schem { background: var(--fig-bg); display: grid; place-items: center }
.mark { position: absolute; border: 2.5px solid #e0402a; border-radius: 7px; pointer-events: none; box-shadow: 0 0 0 2px rgba(255,255,255,.7) }
.mark span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); background: #e0402a; color: #fff; font: 700 13px/1.3 var(--mono); padding: 0 6px; border-radius: 4px; white-space: nowrap }
.hot { position: absolute; border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: transparent; padding: 0 }
.hot.show, .hot.sel { border-color: var(--copper); background: rgba(230, 160, 100, .18) }
.hot.right { border-color: var(--ok); background: rgba(80, 200, 140, .2) }
.hot.wrong { border-color: var(--bad); background: rgba(240, 120, 120, .2) }
.hotlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 4px }
.hotlist button { font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 11px; cursor: pointer }
.hotlist button.on { border-color: var(--copper); color: var(--copper); background: var(--copper-soft) }
.hotinfo { padding: 2px 16px 10px; font-size: 14.5px; min-height: 1.5em }

/* animations */
.anim { position: relative }
.anim-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px 12px }
.anim-ctl label { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.anim-ctl input[type=range] { width: 160px; accent-color: var(--accent) }
.anim-ctl output { font: 500 14px var(--mono); min-width: 4.5em }
.tog { font-size: 14px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer }
.tog[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.readout { font: 14.5px/1.45 var(--sans); padding: 0 16px 10px; color: var(--ink) }

/* svg theming */
.sv { color: var(--ink) }
.sv .st { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.sv .fl { fill: currentColor }
.sv .tx { fill: currentColor; font: 13px var(--sans) }
.sv .txm { fill: var(--muted); font: 12px var(--sans) }
.sv .lbl { fill: currentColor; font: 600 13px var(--mono) }
.sv .acc { stroke: var(--accent) } .sv .accf { fill: var(--accent) }
.sv .cu { stroke: var(--copper) } .sv .cuf { fill: var(--copper) }
.sv .mut { stroke: var(--muted) } .sv .mutf { fill: var(--muted) }
.sv .bad { stroke: var(--bad) } .sv .badf { fill: var(--bad) }
.sv .bg { fill: var(--fig-bg) }
.sv .grid { stroke: var(--line); stroke-width: 1 }
.sv .dot { fill: var(--copper) }

/* recall chips */
.recall { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px }
.recall button { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 99px; padding: 6px 11px; cursor: pointer; text-align: left }

/* warm-up */
.warm { background: var(--copper-soft); border-radius: var(--r); padding: 14px 16px; margin-top: 16px }
.warm h3 { margin: 0 0 4px; font-size: 16px }
.warm .q { margin-top: 12px }

/* quiz */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 14px }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.qtag { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.qtext { font-size: 18px; line-height: 1.4; font-weight: 600; margin: 12px 0 14px; text-wrap: pretty }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: 16px; line-height: 1.4 }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.opt.right { border-color: var(--ok); background: var(--ok-bg) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg) }
.opt:disabled { cursor: default; color: var(--ink) }
.qfig { margin: 0 -16px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--fig-bg) }
.explain { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: 15px }
.explain b { font-weight: 600 }
.qbar { display: flex; gap: 4px; margin-top: 14px }
.qbar i { flex: 1; height: 6px; border-radius: 99px; background: var(--line) }
.qbar i.done { background: var(--accent) }
.qbar i.cur { background: var(--copper) }
.score { font: 700 54px/1 var(--mono); margin: 18px 0 6px; font-variant-numeric: tabular-nums }
.result-ok { color: var(--ok) } .result-bad { color: var(--bad) }
.review { margin-top: 18px }
.review .qcard { border-color: var(--bad) }

/* lists, settings, glossary, credits */
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.item b { display: block }
.set { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px }
.set h3 { margin: 0; font-size: 16px }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.seg button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px; cursor: pointer; text-align: left }
.seg button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.seg button b { display: block; font-size: 14.5px }
.seg button span { display: block; font-size: 12.5px; color: var(--muted) }
.mail { font: 500 15px var(--mono); background: var(--sunk); border-radius: 10px; padding: 10px 12px; user-select: all; overflow-wrap: anywhere }
input[type=search] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink) }
.gl dt { font-weight: 600; margin-top: 12px }
.gl dt span { font-weight: 400; color: var(--muted) }
.gl dd { margin: 2px 0 0; color: var(--ink); font-size: 15px }
.credit { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start }
.credit img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; background: #fff }
.credit div { min-width: 0; font-size: 13.5px; overflow-wrap: anywhere }
.sources { margin-top: 22px }
.sources h3 { font-size: 15px; margin: 0 0 6px }
.sources li { font-size: 14px; margin-bottom: 4px; overflow-wrap: anywhere }

/* sheet (modal) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 0 calc(20px + env(safe-area-inset-bottom)) }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0 16px; position: sticky; top: 0; background: var(--bg); z-index: 1 }
.sheet-h b { flex: 1; font-size: 14px; color: var(--muted) }
.sheet .step { margin: 8px 12px 0 }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }

/* ---------- topography additions ---------- */
.sv .wat { stroke: #2f7fbf } .sv .watf { fill: #2f7fbf }
.sv .for { stroke: #3f7d2c } .sv .forf { fill: #3f7d2c }
.sv .brn { stroke: var(--copper) } .sv .brnf { fill: var(--copper) }
.sv .thin { stroke-width: 1.3 }
.sv .dash { stroke-dasharray: 5 4 }
.sv .txs { fill: currentColor; font: 11px var(--sans) }
.sv .bold { font-weight: 700 }
/* maps: always on paper, independent of theme */
.mapbox { position: relative; background: var(--paper); color: var(--paper-ink); touch-action: none; user-select: none; -webkit-user-select: none }
.mapbox svg { display: block; width: 100%; height: auto }
.mapbox .mlab { font: 600 11px var(--sans); fill: #222 }
.maptools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 4px }
.maptools button { font-size: 13.5px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; cursor: pointer }
.maptools button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.mapread { font: 14.5px/1.5 var(--sans); padding: 4px 16px 10px; min-height: 1.6em }
.mapread b { font-weight: 600 }
.mapread .mono, .mono { font-family: var(--mono); font-weight: 500 }
.task { background: var(--copper-soft); border-radius: 12px; margin: 6px 16px 10px; padding: 10px 12px; font-size: 15px }
.task b { font-weight: 600 }
.task .row { margin-top: 8px }
.task input[type=text], .task input[type=number] { font: 500 16px var(--mono); padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 11em; max-width: 100% }
.task .res { margin-top: 8px; font-size: 14.5px }
.task .res.ok { color: var(--ok) } .task .res.bad { color: var(--bad) }
.qfig .mapbox { border-radius: 0 }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 10px 16px 12px }
.legend-grid > div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 6px 8px; font-size: 13px; line-height: 1.25 }
.legend-grid svg { width: 52px; height: 34px }
.legend-grid span { min-width: 0; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto }
.legend-grid small { display: block; color: #6b6458; font-size: 11.5px }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 4px 0 10px }
table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
table.tbl th { font-weight: 600; color: var(--muted); font-size: 13px }
.tblwrap { overflow-x: auto; margin: 0 0 10px }
.note { border-left: 3px solid var(--copper); padding: 6px 10px; margin: 4px 0 10px; font-size: 14.5px; color: var(--ink); background: var(--copper-soft); border-radius: 0 8px 8px 0 }
.note b { font-weight: 600 }

/* intro */
.introlink { color: var(--accent); font-weight: 600; text-decoration: none }
.intro h3 { margin: 22px 0 6px; font-size: 18px }
.intro .srclist { padding-left: 20px; margin: 0 0 6px }
.intro .srclist li { margin: 0 0 8px; overflow-wrap: anywhere }
.intro .srclist a { color: var(--accent) }
.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px }
.howto h4 { margin: 0 0 6px; font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent) }
.howto ol { margin: 0; padding-left: 20px }
.howto li { margin: 0 0 6px }
.intro .flag { font-size: 28px; text-align: center; margin: 18px 0 }

</style>
</head>

  // ---------- question instancing ----------
  function instance(q) {
    var base = { id: q.id, mod: q.mod, src: q, type: q.type || 'mc' };
    if (q.type === 'calc') {
      var g = q.gen(R, { fmt: fmt, L: L, numOpts: numOpts, needD: needD, lang: S.lang });
      base.q = g.q; base.fig = g.fig || q.fig; base.ex = g.ex;
      if (g.tap) { base.type = 'tap'; base.a = g.a; return base; }
      // drop accidental duplicate options (random generators), keeping the correct one
      (function () { var seen = {}, keep = [], na = 0; g.opts.forEach(function (o, i) { var k = typeof o === 'object' ? JSON.stringify(o) : String(o); if (seen[k]) return; seen[k] = 1; if (i === g.a) na = keep.length; keep.push(o); }); g.opts = keep; g.a = na; })();
      var order = shuffle(g.opts.map(function (o, i) { return i; }));
      base.opts = order.map(function (i) { return g.opts[i]; }); base.a = order.indexOf(g.a);
      base.type = 'mc';
      return base;
    }
    base.q = q.q; base.fig = typeof q.fig === 'function' ? q.fig() : q.fig; base.ex = q.ex;
    if (q.type === 'tap') { base.a = q.a; return base; }
    var ord = shuffle(q.opts.map(function (o, i) { return i; }));
    base.opts = ord.map(function (i) { return q.opts[i]; }); base.a = ord.indexOf(q.a);
    return base;
  }
  function weightOwn(q) { var st = P.q[q.id]; if (!st || !st.s) return 3; if ((st.w || 0) > (st.r || 0)) return 4; if (st.w) return 2; return 1; }
  function weightReview(q) { var st = P.q[q.id]; if (!st || !st.s) return 0.6; return st.w ? 2 + Math.min(st.w, 3) : 0.8; }
  function wsample(items, wfn, n) {
    var pool = items.map(function (x) { return { x: x, w: wfn(x) }; }), out = [];
    while (out.length < n && pool.length) {
      var tot = pool.reduce(function (a, b) { return a + b.w; }, 0), r = Math.random() * tot, i = 0;
      for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
      out.push(pool[i].x); pool.splice(i, 1);
    }
    return out;
  }
  function priorQuestions(m) {
    var out = []; MODS.forEach(function (x) { if (x.n < m.n) out = out.concat(x.quiz); }); return out;
  }
  // "Easter" questions: required to pass, not scored. Always in modules 1, 4, 7, …, sometimes in others.
  var EGGS = [
    { id: 'egg-ua', q: { uk: 'Слава Україні!', en: 'Слава Україні! <span class="muted">(Glory to Ukraine!)</span>' },
      opts: [{ uk: 'Героям слава!', en: 'Героям слава! <span class="muted">(Glory to the heroes!)</span>' }], a: 0,
      ex: { uk: 'Героям слава!', en: 'Героям слава! — Glory to the heroes!' } },
    { id: 'egg-chr', q: { uk: 'Слава Ісусу Христу!', en: 'Слава Ісусу Христу! <span class="muted">(Glory to Jesus Christ!)</span>' },
      opts: [{ uk: 'Слава навіки!', en: 'Слава навіки! <span class="muted">(Glory forever!)</span>' }], a: 0,
      ex: { uk: 'Слава навіки!', en: 'Слава навіки! — Glory forever!' } }
  ];
  function eggFor(m) {
    if (m.n % 3 !== 1 && Math.random() > 0.3) return null;
    var e = EGGS[Math.floor(Math.random() * EGGS.length)];
    var it = instance(e); it.egg = true; it.mod = m.id; return it;
  }
  function buildAttempt(m) {
    var prior = priorQuestions(m);
    var nRev = prior.length ? Math.min(3, prior.length) : 0;
    var nOwn = Math.min(PER_TEST - nRev, m.quiz.length);
    nRev = Math.min(PER_TEST - nOwn, prior.length);
    var qs = wsample(m.quiz, weightOwn, nOwn).concat(wsample(prior, weightReview, nRev));
    var items = shuffle(qs).map(instance), egg = eggFor(m);

  }
  function pickWarm(m) {

    if (!prior.length) return [];
    if (m.warm) { var fixed = m.warm.map(function (id) { return QBYID[id]; }).filter(Boolean); if (fixed.length) return shuffle(fixed).slice(0, 2).map(instance); }

  // ---------- updates ----------

  function checkUpdates() {

      if (!j || !j.latest || vnum(j.latest) <= vnum(VERSION)) return;
      if (S.updateMode === 'auto') { S.pinned = j.latest; saveS(); location.replace('../' + j.latest + '/'); return; }

  // ---------- start ----------
  function start() {
    view = $('#view');

    $('#menu').onclick = function () { go('#settings'); };
    $('#back').onclick = function () {

    render();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').then(function () { precache(allFiles()); }).catch(function () {});
    }
    checkUpdates();
  }

  return { _cur: function () { return Q; }, _inst: instance, _q: QBYID, _build: function (id) { return buildAttempt(BYID[id]); }, module: module, start: start, L: L, fmt: fmt, D: function () { return D; }, mods: MODS, byId: BYID, numOpts: numOpts };
})();

<script>
/* figs.js */
/* figs.js — helpers the module files use: cached training maps, map "anatomy" figures with tap targets,
   legend tiles from the map symbols, and quiz generators on fresh maps. */
var FIG = (function () {
  'use strict';
  var cacheM = {};
  function M(seed, mopt) { var k = seed + '|' + JSON.stringify(mopt || {}); return cacheM[k] || (cacheM[k] = TOPO.make(seed, mopt || {})); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function sp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function fm(n, d) { var s = (+n).toFixed(d == null ? 0 : d); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s.replace('.', ','); }

  // a tap target (box of wmm × hmm map-millimetres) around local point (x,y)
  function hot(Mp, opt, x, y, wmm, hmm, id, label, info) {
    var c = TOPO.pct(Mp, opt, x, y), e = TOPO.pct(Mp, opt, x + wmm / Mp.k, y - hmm / Mp.k);
    var w = Math.abs(e[0] - c[0]), h = Math.abs(e[1] - c[1]);
    return { id: id, p: [+(c[0] - w / 2).toFixed(2), +(c[1] - h / 2).toFixed(2), +w.toFixed(2), +h.toFixed(2)], label: label, info: info };
  }

  // a generated map with named parts to tap
  function anatomy(seed, opt) {
    opt = opt || {};
    var m = M(seed, { scale: 25000 }), o = { id: 'an' + seed, crop: opt.crop }, H = [];
    var cr = o.crop || [0, 0, m.w, m.h];
    function inC(x, y) { return x > cr[0] + 60 && x < cr[2] - 60 && y > cr[1] + 60 && y < cr[3] - 60; }
    if (inC(m.village.x, m.village.y)) H.push(hot(m, o, m.village.x, m.village.y + 140, 22, 12, 'vil', 'Населений пункт ' + m.village.name, 'кварталики — будинки; під назвою — кількість дворів (' + m.village.count + ')'));
    var rq = TOPO.pointAt(m.river, TOPO.lineLen(m.river) * 0.45);
    if (inC(rq.p[0], rq.p[1])) H.push(hot(m, o, rq.p[0], rq.p[1], 9, 9, 'riv', 'Річка ' + m.names.river, m.riverWide ? 'ширша за 5 м — у дві лінії з блакитною заливкою' : 'вужча за 5 м — однією синьою лінією'));
    var fo = m.forests[0]; if (fo && inC(fo.c[0], fo.c[1])) H.push(hot(m, o, fo.c[0], fo.c[1], 16, 12, 'for', 'Ліс', 'зелена заливка, межа — пунктир; підпис «' + fo.spec.kind + ' ' + fo.spec.hgt + '/' + fm(fo.spec.thick, 2) + '/' + fo.spec.gap + '» — порода, висота (м) / товщина стовбурів (м) / відстань між деревами (м)'));
    var bl = m.belts[0]; if (bl) { var bc = [(bl[0][0] + bl[1][0]) / 2, (bl[0][1] + bl[1][1]) / 2]; if (inC(bc[0], bc[1])) H.push(hot(m, o, bc[0], bc[1], 9, 9, 'belt', 'Лісосмуга', 'вузька смуга дерев — типовий орієнтир і укриття в степу')); }
    var rd = TOPO.pointAt(m.road, TOPO.lineLen(m.road) * 0.15); if (inC(rd.p[0], rd.p[1])) H.push(hot(m, o, rd.p[0], rd.p[1], 9, 9, 'road', 'Шосе', 'дорога з твердим покриттям — помаранчева заливка в чорних берегових лініях'));
    if (m.trig && inC(m.trig.x, m.trig.y)) H.push(hot(m, o, m.trig.x, m.trig.y, 9, 9, 'trig', 'Геодезичний пункт ' + TOPO.fmtH(m.trig.h), 'трикутник з точкою; число — абсолютна висота в метрах'));
    var ic = m.contours.filter(function (c) { return c.idx && TOPO.lineLen(c.p) * m.k > 40; })[0];
    if (ic) { var iq = TOPO.pointAt(ic.p, TOPO.lineLen(ic.p) * 0.6); if (inC(iq.p[0], iq.p[1])) H.push(hot(m, o, iq.p[0], iq.p[1], 7, 7, 'cont', 'Потовщена горизонталь ' + Math.round(ic.h) + ' м', 'кожна п’ята горизонталь — товща, щоб легше рахувати висоту')); }
    var gx = Math.ceil((m.e0 + cr[0]) / 1000) * 1000 - m.e0 + 1000; if (gx < cr[2] - 100) H.push(hot(m, o, gx, cr[1] + (cr[3] - cr[1]) * 0.78, 4, 14, 'grid', 'Лінія кілометрової сітки', 'лінії через 1 км; підписи за рамкою — кілометри координат'));
    var bl = TOPO.pct(m, o, cr[0], cr[1]), th = (cr[3] - cr[1]) * m.k + 6 + 17;
    H.push({ id: 'scale', p: [+bl[0].toFixed(2), +(bl[1] + 2 / th * 100).toFixed(2), +(100 - 2 * bl[0]).toFixed(2), +(11 / th * 100).toFixed(2)], label: 'Масштаб і висота перерізу', info: 'лінійний масштаб, числовий масштаб і через скільки метрів проведено горизонталі' });
    return { map: TOPO.svg(m, o), hot: H, cap: opt.cap || 'Навчальна карта: місцевість вигадана, сітка — справжнього формату (MGRS). Торкаємося назв під картою.' };
  }

  function sym(kind, w, h) {
    var vb = { tree: '-3 -4.2 6 5', tower: '-3 -3.4 6 5', church: '-3 -3.6 6 5', monument: '-3 -3.2 6 4.2' }[kind] || '-3 -2.5 6 5';
    return '<svg viewBox="' + vb + '" width="' + (w || 52) + '" height="' + (h || 34) + '" xmlns="http://www.w3.org/2000/svg">' + TOPO.sym(kind, 0, 0, 1) + '</svg>';
  }
  // a legend tile with any svg content drawn in a 0..12 × 0..8 box
  function tile(inner) { return '<svg viewBox="0 0 12 8" width="52" height="34" xmlns="http://www.w3.org/2000/svg"><rect width="12" height="8" fill="#f8f5ea"/>' + inner + '</svg>'; }
  var C = TOPO.C;
  var TILES = {
    road: tile('<path d="M0,4 H12" stroke="#222" stroke-width="1.6"/><path d="M0,4 H12" stroke="' + C.road + '" stroke-width="1.1"/>'),
    dirt: tile('<path d="M0,4 C4,3 8,5 12,4" stroke="#2a2a2a" stroke-width="0.4" fill="none"/>'),
    field: tile('<path d="M0,4 H12" stroke="#333" stroke-width="0.3" stroke-dasharray="1.4 0.9"/>'),
    river: tile('<path d="M0,5 C4,2 8,6 12,3" stroke="' + C.water + '" stroke-width="0.6" fill="none"/>'),
    river2: tile('<path d="M0,5 C4,2 8,6 12,3" stroke="' + C.water + '" stroke-width="2.4" fill="none"/><path d="M0,5 C4,2 8,6 12,3" stroke="' + C.waterFill + '" stroke-width="1.6" fill="none"/>'),
    forest: tile('<rect x="1" y="1" width="10" height="6" rx="2" fill="' + C.forest + '" stroke="' + C.forestEdge + '" stroke-width="0.3" stroke-dasharray="0.3 0.7"/><circle cx="6" cy="3.6" r="0.8" fill="none" stroke="#2c5a1f" stroke-width="0.25"/><path d="M6,4.4 v0.8" stroke="#2c5a1f" stroke-width="0.25"/>'),
    belt: tile('<path d="M1,4 H11" stroke="' + C.belt + '" stroke-width="0.6"/>' + [1, 2.5, 4, 5.5, 7, 8.5, 10].map(function (x) { return '<circle cx="' + x + '" cy="4" r="0.45" fill="' + C.belt + '"/>'; }).join('')),
    swamp: tile([2, 3.5, 5, 6.5].map(function (y, i) { return '<path d="M' + (1 + i % 2) + ',' + y + ' h2.2 m1 0 h2.2 m1 0 h2.2" stroke="' + C.swamp + '" stroke-width="0.32"/>'; }).join('')),
    power: tile('<path d="M0,4 H12" stroke="#333" stroke-width="0.25"/><circle cx="3" cy="4" r="0.45" fill="#fff" stroke="#222" stroke-width="0.2"/><circle cx="9" cy="4" r="0.45" fill="#fff" stroke="#222" stroke-width="0.2"/>'),
    houses: tile([[2, 2], [4, 2], [6, 2], [2, 5], [4.4, 5], [7, 5], [9, 2.2]].map(function (p) { return '<rect x="' + p[0] + '" y="' + p[1] + '" width="1.2" height="0.9" fill="#2a2a2a"/>'; }).join('') + '<path d="M0,3.6 H12" stroke="#2a2a2a" stroke-width="0.3"/>'),
    contour: tile('<path d="M0,6 C3,2 9,2 12,6" stroke="' + C.contour + '" stroke-width="0.25" fill="none"/><path d="M0,7.5 C3,0.5 9,0.5 12,7.5" stroke="' + C.contour + '" stroke-width="0.5" fill="none"/>'),
    bridge: tile('<path d="M6,0 V8" stroke="' + C.water + '" stroke-width="1.6"/><path d="M0,4 H12" stroke="#222" stroke-width="1.3"/><path d="M0,4 H12" stroke="' + C.road + '" stroke-width="0.9"/><path d="M4.2,2.4 l0.5,0.5 h2.6 l0.5,-0.5 M4.2,5.6 l0.5,-0.5 h2.6 l0.5,0.5" stroke="#222" stroke-width="0.3" fill="none"/>')
  };
  function legend(items) {
    return '<div class="legend-grid">' + items.map(function (it) {
      var pic = TILES[it[0]] || sym(it[0]);
      return '<div>' + pic + '<span>' + it[1] + (it[2] ? '<small>' + it[2] + '</small>' : '') + '</span></div>';
    }).join('') + '</div>';
  }

  // ---------- quiz helpers ----------
  function qmap(R, mopt) { return TOPO.make(R.int(1, 2000000000), mopt || {}); }
  function pickPt(Mp, R, filt) {
    var a = Mp.pts.filter(filt || function (p) { return !p.noSym || p.kind === 'cross'; });
    return a[R.int(0, a.length - 1)];
  }
  function kname(p) { return (TOPO.KIND[p.kind] || { n: 'точка', g: 'точки' }); }
  // MGRS 8-digit options with typical mistakes
  function mgrsOpts(Mp, p) {
    var g = TOPO.mgrs(Mp, p.x, p.y, 8), e = g.e, n = g.n;
    var bump = function (s, k) { var v = (+s + k + 10000) % 10000; return ('000' + v).slice(-4); };
    var cands = [e + ' ' + n, n + ' ' + e, bump(e, 100) + ' ' + n, e + ' ' + bump(n, 100), bump(e, -100) + ' ' + bump(n, -100), e.slice(0, 2) + n.slice(2) + ' ' + n.slice(0, 2) + e.slice(2)];
    var out = []; cands.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
    return { opts: out.slice(0, 4), a: 0, g: g };
  }
  function cropFor(Mp, pts, marginM) {
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; }), m = marginM || 400 * Mp.sf;
    var x0 = Math.max(0, Math.min.apply(0, xs) - m), x1 = Math.min(Mp.w, Math.max.apply(0, xs) + m), y0 = Math.max(0, Math.min.apply(0, ys) - m), y1 = Math.min(Mp.h, Math.max.apply(0, ys) + m);
    var cw = x1 - x0, ch = y1 - y0, want = 0.78;
    if (ch / cw > want) { var add = ch / want - cw; x0 = Math.max(0, x0 - add / 2); x1 = Math.min(Mp.w, x1 + add / 2); }
    else { var addh = cw * want - ch; y0 = Math.max(0, y0 - addh / 2); y1 = Math.min(Mp.h, y1 + addh / 2); }
    return [x0, y0, x1, y1];
  }
  function mapFig(Mp, opt) { opt = opt || {}; opt.id = opt.id || ('q' + Math.floor(Math.random() * 1e7)); return { map: TOPO.svg(Mp, opt), _opt: opt }; }
  // tap question: candidates [{x,y,id}] → hot boxes
  function tapFig(Mp, opt, cands, sizeMM) {
    var f = mapFig(Mp, opt);
    f.hot = cands.map(function (c) { return hot(Mp, f._opt, c.x, c.y, sizeMM || 9, sizeMM || 9, c.id); });
    return f;
  }
  return { M: M, anatomy: anatomy, sym: sym, legend: legend, TILES: TILES, hot: hot, qmap: qmap, pickPt: pickPt, kname: kname, mgrsOpts: mgrsOpts, cropFor: cropFor, mapFig: mapFig, tapFig: tapFig, sp: sp, fm: fm, esc: esc };
})();

(function () {

  APP.module({

    intro: 'Напрямок задають кутом від півночі. Але північ буває трьох видів: географічна, магнітна і «північ сітки» карти. Компас показує одну, карта — іншу. Вчимося переходити між ними без помилок — від цього залежить, куди ми прийдемо і куди полетить снаряд.',
    warm: ['m09q04', 'm09q08'],
    steps: [
      {
        kind: 1,
        title: 'Три кути напрямку',
        body: '<p>Усі три рахують <b>за годинниковою стрілкою від 0 до 360°</b> (або від 0-00 до 60-00) від північного напрямку, але від різних ліній:</p><ul><li><b>Істинний (географічний) азимут А</b> — від географічного меридіана (на справжній північний полюс).</li><li><b>Магнітний азимут Ам</b> — від магнітного меридіана (куди показує стрілка компаса).</li><li><b>Дирекційний кут α</b> — від вертикальної лінії кілометрової сітки (північ сітки). Саме його міряють на карті.</li></ul><p>Ще буває <b>румб</b> — гострий кут від північного або південного напрямку з назвою чверті (ПдСх 43°); у військах рідко.</p>'
      },
      {
        kind: 1,
        title: 'Зближення меридіанів γ',
        body: '<p>Лінії сітки паралельні <b>осьовому</b> меридіану зони, а інші меридіани до нього нахилені. Кут між географічним меридіаном точки і вертикальною лінією сітки — <b>зближення меридіанів γ</b>.</p><ul><li>γ додатне (+), якщо північ сітки відхилена на <b>схід</b> від географічної; від’ємне — на захід.</li><li>На осьовому меридіані і на екваторі γ = 0; у межах зони — не більше 3°.</li><li>Східніше осьового меридіана γ &gt; 0, західніше — γ &lt; 0.</li></ul><div class="formula">γ = (L − L₀) · sin B</div><p>Приклад: точка 51°17′ пн. ш., 44°13′ сх. д., осьовий меридіан 45°. l = −47′; γ = −47′ × sin 51°17′ ≈ <b>−37′</b>. На карті γ для центру аркуша підписано в лівому нижньому куті.</p><div class="formula">А = α + γ</div>'
      },
      {
        kind: 1,
        title: 'Магнітне схилення δ',
        body: '<p>Магнітна стрілка показує не на географічний полюс. Кут між географічним і магнітним меридіанами — <b>магнітне схилення δ</b>.</p><ul><li><b>Східне</b> (стрілка відхилена на схід) — додатне; <b>західне</b> — від’ємне.</li><li>Змінюється з місцем (на карті 1:500 000 і 1:1 000 000 — лінії однакового схилення, ізогони) і з часом: <b>річна зміна</b> підписана на карті (до кількох хвилин на рік).</li><li>Є райони <b>магнітних аномалій</b>, де схилення стрибає на градуси на 1–2 км (в Україні — Криворізька). Там компасу не довіряємо.</li></ul><div class="formula">А = Ам + δ</div><p>Сьогодні в Україні схилення <b>східне, кілька градусів</b>. Точне значення для своєї точки й дати — на полях свіжої карти або в калькуляторі World Magnetic Model (NOAA).</p>'
      },
      {
        kind: 3,
        title: 'Поправка напрямку: від карти до компаса',
        body: '<p>Прирівнюємо дві формули для А: <b>α + γ = Ам + δ</b>. Звідси:</p><div class="formula">Ам = α − (δ − γ)      α = Ам + (δ − γ)</div><p>Величину <b>ПН = δ − γ</b> називають <b>поправкою напрямку</b> (на картах НАТО — відхилення магнітної стрілки від лінії сітки, grivation). В артилерії той самий кут зі зворотним знаком звуть <b>поправкою бусолі</b>: ΔАм = γ − δ, тоді Ам = α + ΔАм.</p><p><b>Приклад.</b> δ = +7°40′ (сх.), γ = −1°50′. ПН = 7°40′ − (−1°50′) = <b>+9°30′</b>. На карті виміряли α = 60°. На компасі виставляємо Ам = 60° − 9°30′ = <b>50°30′</b>.</p><div class="key">Не довіряємо пам’яті знаків — дивимося на схему трьох півночей під рамкою карти: з неї видно, в який бік відхилена магнітна стрілка від лінії сітки.</div>',

        body: '<p>На карті вказано схилення на рік видання і річну зміну. Схилення поточного року:</p><div class="formula">δ = δ(рік карти) + річна зміна × кількість років</div><p>Приклад: карта 2016 р., δ = +6°20′ (сх.), річна зміна +8′ (сх.). У 2026 р.: 6°20′ + 8′ × 10 = 6°20′ + 1°20′ = <b>+7°40′</b>.</p><p>Західну річну зміну беремо зі знаком «−».</p>'

        body: '<p>Спостерігач бачить ціль праворуч від орієнтира 2 на кут 0-40. Дальність до орієнтира — 1500 м. Відстань між орієнтиром і ціллю по фронту:</p><div class="formula">l = 40 × 1500 / 1000 = 60 м</div><p>Так приймальна сторона знаходить ціль на своїй карті: від орієнтира 2 — праворуч 60 м, ближче/далі — на вказану різницю.</p><p>Спостерігачу з вертольота чи дрона ціль зручно вказувати від характерних об’єктів (вигини річок, перехрестя, кути лісу), яким заздалегідь присвоїли номери.</p>'
      },
      {
        kind: 3,
        title: 'Полярний спосіб: від себе — до цілі',
        body: '<p>Знаємо координати своєї точки (СП), дирекційний кут α на ціль і дальність Д (далекомір, дрон, формула тисячних). Прирости координат:</p><div class="formula">ΔE = Д · sin α      ΔN = Д · cos α</div><p>Координати цілі = координати СП + прирости (зі своїми знаками). У старій системі ті самі прирости звуть ΔY і ΔX.</p><p><b>Приклад.</b> СП: E = 46 300, N = 80 200. α = 50°, Д = 1200 м. ΔE = 1200 × 0,766 = +919; ΔN = 1200 × 0,643 = +771. Ціль: E = 47 219, N = 80 971 → <b>4721 8097</b>.</p><div class="key">Компас дає <b>магнітний азимут</b> — спершу переводимо його в дирекційний кут: α = Ам + ПН.</div>',
